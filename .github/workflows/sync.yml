name: sync

# Weekly merge of upstream anomalyco/opencode dev into a sync branch + PR.
# NEVER pushes main directly — a human reviews and merges the PR.
# Conflicts fail the job loudly; they should only ever touch the tiny
# committed patch set (README is auto-resolved via merge=ours).

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "understudy-sync[bot]"
          git config user.email "team@worklyn.com"
          # honor `README.md merge=ours` in .gitattributes
          git config merge.ours.driver true

      - name: Merge upstream/dev
        id: merge
        run: |
          git remote add upstream https://github.com/anomalyco/opencode
          git fetch upstream dev
          BRANCH="sync/upstream-$(date -u +%Y-%m-%d)"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          git checkout -b "$BRANCH"
          BEFORE=$(git rev-parse HEAD)

          # The fork replaces upstream's CI: every workflow except build.yml
          # and sync.yml is deleted here on purpose (upstream's are gated on
          # `github.repository == 'anomalyco/opencode'` and could never run
          # for us). Upstream edits those files constantly, and each edit
          # arrives as a modify/delete conflict — which is why no sync had
          # ever completed. `merge=ours` cannot help: git never invokes a
          # merge driver for modify/delete.
          #
          # Keep our deletion for exactly that path, and nothing else. Any
          # other conflict is real and still stops the job for a human.
          if ! git merge --no-edit upstream/dev; then
            UNRESOLVED=""
            for f in $(git diff --name-only --diff-filter=U); do
              if [ "${f#.github/workflows/}" != "$f" ] && ! git cat-file -e "HEAD:$f" 2>/dev/null; then
                git rm -q -f "$f"
                echo "  kept our deletion: $f"
              else
                UNRESOLVED="$UNRESOLVED $f"
              fi
            done
            if [ -n "$UNRESOLVED" ]; then
              echo "::error::conflicts that need a human:$UNRESOLVED"
              exit 1
            fi
            git commit --no-edit
          fi

          if [ "$(git rev-parse HEAD)" = "$BEFORE" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Already up to date with upstream/dev."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Assert transform anchors still hold
        run: bash script/understudy-transform.sh --check-only

      - name: Push branch + open PR
        if: steps.merge.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git push origin "${{ steps.merge.outputs.branch }}"
          gh pr create \
            --base main \
            --head "${{ steps.merge.outputs.branch }}" \
            --title "sync: upstream dev $(date -u +%Y-%m-%d)" \
            --body "Weekly merge of upstream [anomalyco/opencode](https://github.com/anomalyco/opencode) \`dev\`. Transform anchor assertions passed. Review and merge by hand — never auto-merged."
