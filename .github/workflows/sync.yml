name: sync

# Weekly merge of upstream anomalyco/opencode dev into a sync branch + PR.
# NEVER pushes main directly — a human reviews and merges the PR.
# Conflicts fail the job loudly; they should only ever touch the tiny
# committed patch set (README is auto-resolved via merge=ours).

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "understudy-sync[bot]"
          git config user.email "team@worklyn.com"
          # honor `README.md merge=ours` in .gitattributes
          git config merge.ours.driver true

      - name: Merge upstream/dev
        id: merge
        run: |
          git remote add upstream https://github.com/anomalyco/opencode
          git fetch upstream dev
          BRANCH="sync/upstream-$(date -u +%Y-%m-%d)"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          git checkout -b "$BRANCH"
          BEFORE=$(git rev-parse HEAD)

          # The fork replaces upstream's CI: every workflow except build.yml
          # and sync.yml is deleted here on purpose (upstream's are gated on
          # `github.repository == 'anomalyco/opencode'` and could never run
          # for us). Upstream edits those files constantly, and each edit
          # arrives as a modify/delete conflict — which is why no sync had
          # ever completed. `merge=ours` cannot help: git never invokes a
          # merge driver for modify/delete.
          #
          # Keep our deletion for exactly that path, and nothing else. Any
          # other conflict is real and still stops the job for a human.
          if ! git merge --no-edit upstream/dev; then
            UNRESOLVED=""
            for f in $(git diff --name-only --diff-filter=U); do
              if [ "${f#.github/workflows/}" != "$f" ] && ! git cat-file -e "HEAD:$f" 2>/dev/null; then
                git rm -q -f "$f"
                echo "  kept our deletion: $f"
              else
                UNRESOLVED="$UNRESOLVED $f"
              fi
            done
            if [ -n "$UNRESOLVED" ]; then
              echo "::error::conflicts that need a human:$UNRESOLVED"
              exit 1
            fi
            git commit --no-edit
          fi

          if [ "$(git rev-parse HEAD)" = "$BEFORE" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Already up to date with upstream/dev."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Assert transform anchors still hold
        run: bash script/understudy-transform.sh --check-only

      - name: Push branch + open PR
        if: steps.merge.outputs.changed == 'true'
        env:
          # A PAT when one is configured, else the workflow token. Dropping a
          # SYNC_PAT into repo secrets makes PR creation start working with no
          # further edit to this file.
          GH_TOKEN: ${{ secrets.SYNC_PAT || github.token }}
          BRANCH: ${{ steps.merge.outputs.branch }}
        run: |
          # Re-dispatching sync on the same day rebuilds the merge commit onto a
          # branch that already exists (the name is date-only), which git rejects
          # as non-fast-forward. The branch is machine-generated and disposable,
          # so update it; fetch first so --force-with-lease still guards against
          # anything pushed to it during this run.
          git fetch origin "$BRANCH" 2>/dev/null || true
          git push --force-with-lease origin "$BRANCH"

          # The merge, the anchor assertions and the push above ARE the work of
          # this job, and all of them have succeeded by the time we get here.
          # GITHUB_TOKEN cannot open the PR in this org: createPullRequest comes
          # back "Resource not accessible by integration" even with
          # pull-requests: write and with both the org and the repo set to allow
          # Actions to create pull requests — so the restriction sits above us
          # (enterprise policy). Failing the job here would paint a green sync
          # red and bury the fact that the branch is already pushed and ready.
          # Warn with a one-click link instead.
          # REST, not `gh pr create`. That command goes through the GraphQL
          # createPullRequest mutation, which refuses a fine-grained PAT
          # ("Resource not accessible by personal access token") even when the
          # token holds pull_requests=write on this repo. The REST endpoint
          # accepts the same token and returns 201 — verified by hand against
          # this repo before making the switch.
          if ! gh api -X POST "repos/$GITHUB_REPOSITORY/pulls" \
            -f base=main \
            -f head="$BRANCH" \
            -f title="sync: upstream dev $(date -u +%Y-%m-%d)" \
            -f body="Weekly merge of upstream [anomalyco/opencode](https://github.com/anomalyco/opencode) \`dev\`. Transform anchor assertions passed. Review and merge by hand — never auto-merged." \
            --jq .html_url; then
            echo "::warning::Upstream merged and pushed to $BRANCH, but PR creation was refused. Open it here: https://github.com/$GITHUB_REPOSITORY/compare/main...$BRANCH?expand=1"
          fi
